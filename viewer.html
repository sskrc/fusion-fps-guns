<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gun Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#090b0e; --panel:rgba(16,19,24,.74); --line:rgba(255,255,255,.1); --text:#e8eaee; --dim:#9aa1ac; --amber:#ffb020; --cyan:#3fd8ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; color:var(--text); font-family:"Noto Sans JP",system-ui,sans-serif; overflow:hidden; }
  body { background: radial-gradient(ellipse 66% 60% at 52% 50%, #c6ced8 0%, #909ba9 30%, #4a535f 58%, #181c22 82%, #0a0c0f 100%) #0a0c0f; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .mono { font-family:"Chakra Petch",monospace; letter-spacing:.08em; }
  .frame { position:fixed; inset:14px; border:1px solid var(--line); pointer-events:none; }
  header { position:fixed; left:38px; top:30px; pointer-events:none; max-width:min(560px,calc(100% - 76px)); }
  a.back { pointer-events:auto; display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text); text-decoration:none;
           background:var(--panel); border:1px solid var(--line); padding:7px 13px; margin-bottom:16px; backdrop-filter:blur(10px); transition:border-color .15s; }
  a.back:hover { border-color:var(--amber); }
  header .tag { color:var(--amber); font-size:12px; }
  header h1 { font-family:"Chakra Petch"; font-weight:700; font-size:clamp(32px,5.4vw,70px); line-height:.95; letter-spacing:.02em; }
  header p { color:#c3c8d0; font-size:13px; margin-top:10px; max-width:30em; line-height:1.7; text-shadow:0 1px 8px rgba(0,0,0,.6); }
  .status { position:fixed; right:38px; top:30px; width:230px; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px); padding:14px 16px; }
  .status h2 { font-family:"Chakra Petch"; font-size:11px; color:var(--dim); font-weight:500; letter-spacing:.2em; margin-bottom:6px; }
  .row { display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-top:1px solid var(--line); }
  .row b { font-family:"Chakra Petch"; font-weight:600; color:var(--cyan); letter-spacing:.06em; }
  .actions { position:fixed; left:50%; bottom:32px; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:min(1000px,calc(100% - 60px)); }
  button { font-family:"Noto Sans JP"; color:var(--text); background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px);
           padding:10px 15px 10px 11px; font-size:13.5px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:9px;
           transition:border-color .15s, background .15s, transform .08s; }
  button:hover { border-color:var(--amber); background:rgba(40,32,14,.78); }
  button:active { transform:translateY(1px); }
  button kbd { font-family:"Chakra Petch"; font-size:11px; color:#0a0a0a; background:var(--amber); padding:2px 6px; min-width:20px; text-align:center; font-weight:700; }
  button.on { border-color:var(--cyan); } button.on kbd { background:var(--cyan); }
  button.playing { border-color:var(--amber); }
  button:disabled { opacity:.35; cursor:default; }
  #actions { display:contents; }
  button.explode { border-color:rgba(63,216,255,.45); }
  .tools { position:fixed; right:38px; bottom:32px; display:flex; flex-direction:column; gap:8px; }
  .tools button { padding:8px 12px; font-size:12px; }
  .hint { position:fixed; left:38px; bottom:36px; color:#aab0ba; font-size:12px; line-height:1.8; pointer-events:none; max-width:17em; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); transition:opacity .5s; z-index:5; }
  #loading div { font-family:"Chakra Petch"; letter-spacing:.3em; color:var(--amber); font-size:13px; text-align:center; line-height:2.2; }
  #loading a { color:var(--text); letter-spacing:.05em; font-family:"Noto Sans JP"; }
  #loading.done { opacity:0; pointer-events:none; }
  @media (max-width:1180px) { .hint { display:none; } }
  @media (max-width:900px) {
    header { left:20px; top:18px; } header p { display:none; }
    .status, .hint { display:none; }
    .actions { bottom:20px; gap:6px; width:calc(100% - 24px); } button { padding:8px 10px; font-size:12.5px; } button kbd { display:none; }
    .tools { right:16px; bottom:auto; top:18px; flex-direction:row; } .tools button:nth-child(n+2) { display:none; }
  }
  button { white-space:nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div class="frame"></div>
<header>
  <a class="back" href="./">← 銃の一覧へ</a>
  <div class="tag mono" id="tag"></div>
  <h1 id="name"></h1>
  <p id="desc"></p>
</header>
<aside class="status">
  <h2>SPEC</h2>
  <div class="row"><span>全長</span><b id="sLen">—</b></div>
  <div class="row"><span>全高</span><b id="sHgt">—</b></div>
  <div class="row"><span>アニメーション</span><b id="sClips">—</b></div>
  <div class="row"><span>再生中</span><b id="sNow">—</b></div>
</aside>
<div class="hint">ドラッグで回転、ホイールでズーム。<br>下のボタンか数字キーで動かせます。<b>X</b> で分解。</div>
<div class="actions"><nav id="actions"></nav><button id="btnExplode" class="explode"><kbd>X</kbd><span id="explodeLabel">分解する</span></button></div>
<div class="tools">
  <button id="btnRotate">自動回転</button>
  <button id="btnReset">姿勢を戻す</button>
  <button id="btnView">視点リセット</button>
</div>
<div id="loading"><div id="loadText">LOADING MODEL</div></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
