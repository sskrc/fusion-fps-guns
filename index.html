<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P230 Interactive Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#090b0e; --panel:rgba(16,19,24,.72); --line:rgba(255,255,255,.09); --text:#e8eaee; --dim:#8a919c;
          --amber:#ffb020; --cyan:#3fd8ff; --red:#ff4d3d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:"Noto Sans JP",system-ui,sans-serif; overflow:hidden; }
  body { background:
      radial-gradient(ellipse 62% 58% at 52% 50%, #c3ccd6 0%, #8d98a6 30%, #47505c 58%, #171b21 82%, #0a0c0f 100%); }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .mono { font-family:"Chakra Petch",monospace; letter-spacing:.08em; }
  .frame { position:fixed; inset:14px; border:1px solid var(--line); pointer-events:none; }
  .frame:before,.frame:after { content:""; position:absolute; width:22px; height:22px; border:2px solid var(--amber); }
  .frame:before { left:-1px; top:-1px; border-right:0; border-bottom:0; }
  .frame:after { right:-1px; bottom:-1px; border-left:0; border-top:0; }

  header { position:fixed; left:38px; top:32px; pointer-events:none; }
  header .tag { color:var(--amber); font-size:12px; }
  header h1 { font-family:"Chakra Petch"; font-weight:700; font-size:clamp(40px,7vw,92px); line-height:.9; letter-spacing:.02em; }
  header h1 span { color:transparent; -webkit-text-stroke:1px rgba(255,255,255,.35); }
  header p { color:var(--dim); font-size:13px; margin-top:10px; max-width:30em; line-height:1.7; }

  .status { position:fixed; right:38px; top:32px; width:250px; background:var(--panel); border:1px solid var(--line);
            backdrop-filter:blur(10px); padding:16px 18px; }
  .status h2 { font-family:"Chakra Petch"; font-size:11px; color:var(--dim); font-weight:500; letter-spacing:.2em; margin-bottom:10px; }
  .ammo { display:flex; align-items:flex-end; gap:10px; margin-bottom:10px; }
  .ammo .n { font-family:"Chakra Petch"; font-weight:700; font-size:54px; line-height:.85; color:var(--amber); }
  .ammo .n.empty { color:var(--red); }
  .ammo .plus { font-family:"Chakra Petch"; font-size:18px; color:var(--dim); padding-bottom:4px; }
  .pips { display:flex; gap:4px; margin-bottom:14px; }
  .pips i { flex:1; height:16px; background:rgba(255,255,255,.08); border-radius:2px 2px 6px 6px; transition:background .15s; }
  .pips i.on { background:linear-gradient(#ffd27a,#c88a1e); }
  .row { display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-top:1px solid var(--line); }
  .row b { font-family:"Chakra Petch"; font-weight:600; color:var(--cyan); letter-spacing:.06em; }
  .row b.warn { color:var(--red); } .row b.hot { color:var(--amber); }

  .actions { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap;
             justify-content:center; width:min(980px,calc(100% - 60px)); }
  button { font-family:"Noto Sans JP"; color:var(--text); background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px);
           padding:11px 16px 11px 12px; font-size:13.5px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:10px;
           transition:border-color .15s, background .15s, transform .08s, opacity .2s; }
  button:hover { border-color:var(--amber); background:rgba(40,32,14,.75); }
  button:active { transform:translateY(1px); }
  button kbd { font-family:"Chakra Petch"; font-size:11px; color:#0a0a0a; background:var(--amber); padding:2px 6px; min-width:22px; text-align:center; font-weight:700; }
  button.primary { border-color:rgba(255,176,32,.6); }
  button.on { border-color:var(--cyan); } button.on kbd { background:var(--cyan); }
  button:disabled { opacity:.35; cursor:default; }
  .tools { position:fixed; right:38px; bottom:34px; display:flex; flex-direction:column; gap:8px; }
  .tools button { padding:8px 12px; font-size:12px; }

  .hint { position:fixed; left:38px; bottom:110px; color:var(--dim); font-size:12px; line-height:1.8; pointer-events:none; }
  .hint b { color:var(--text); font-weight:500; }
  .note { position:fixed; left:38px; bottom:40px; font-size:11px; color:#6c727c; max-width:24em; line-height:1.6; pointer-events:none; }

  .label { position:fixed; left:0; top:0; transform:translate(-50%,-50%); pointer-events:none; opacity:0; transition:opacity .35s;
           font-size:12px; white-space:nowrap; display:flex; align-items:center; gap:8px; background:rgba(10,12,15,.78); padding:3px 9px 3px 7px;
           border:1px solid var(--line); }
  .label:before { content:""; width:7px; height:7px; border:1.5px solid var(--amber); transform:rotate(45deg); }
  .label em { font-family:"Chakra Petch"; font-style:normal; color:var(--amber); font-size:10px; letter-spacing:.14em; }
  .label.show { opacity:1; }

  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); transition:opacity .6s; z-index:5; }
  #loading div { font-family:"Chakra Petch"; letter-spacing:.3em; color:var(--amber); font-size:13px; }
  #loading.done { opacity:0; pointer-events:none; }
  .flashfx { position:fixed; inset:0; background:radial-gradient(circle at 50% 45%, rgba(255,200,120,.22), transparent 55%); opacity:0; pointer-events:none; }

  @media (max-width: 1180px) { .note { display:none; } .hint { bottom:132px; } .tools { bottom:auto; top:300px; }
    .actions { gap:6px; } button { padding:9px 11px 9px 9px; font-size:12.5px; } }
  @media (max-width: 820px) {
    header { left:26px; top:24px; } header p { display:none; }
    .status { right:26px; top:auto; bottom:150px; width:190px; padding:12px; } .ammo .n { font-size:40px; }
    .hint,.note,.tools { display:none; }
    .actions { bottom:24px; gap:6px; } button { padding:9px 10px; font-size:12px; } button kbd { display:none; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div class="flashfx" id="flashfx"></div>
<div class="frame"></div>

<header>
  <div class="tag mono">COMPACT DA/SA &nbsp;//&nbsp; INTERACTIVE DISPLAY MODEL</div>
  <h1>P<span>230</span></h1>
  <p>ドラッグで回転、ホイールでズーム。下のボタンかキーボードで、発砲・マガジンの脱着・スライド操作・分解を試せます。</p>
</header>

<aside class="status">
  <h2>STATUS</h2>
  <div class="ammo"><div class="n" id="ammoN">7</div><div class="plus" id="ammoPlus">+1</div></div>
  <div class="pips" id="pips"></div>
  <div class="row"><span>薬室</span><b id="sChamber">—</b></div>
  <div class="row"><span>ハンマー</span><b id="sHammer">—</b></div>
  <div class="row"><span>スライド</span><b id="sSlide">—</b></div>
  <div class="row"><span>マガジン</span><b id="sMag">—</b></div>
</aside>

<div class="hint" id="hint"></div>
<div class="note">展示用の3Dモデルです。銃身は中実で、内部機構は再現していません。発砲はアニメーションによる演出です。</div>

<nav class="actions" id="actions">
  <button class="primary" data-act="fire"><kbd>SPACE</kbd>発砲</button>
  <button data-act="mag"><kbd>M</kbd><span id="magLabel">マガジンを抜く</span></button>
  <button data-act="reload"><kbd>R</kbd>リロード</button>
  <button data-act="rack"><kbd>S</kbd><span id="rackLabel">スライドを引く</span></button>
  <button data-act="decock"><kbd>D</kbd>デコック</button>
  <button data-act="explode" id="btnExplode"><kbd>X</kbd><span id="explodeLabel">分解する</span></button>
</nav>
<div class="tools">
  <button data-act="rotate" id="btnRotate">自動回転</button>
  <button data-act="sound" id="btnSound" class="on">サウンド ON</button>
  <button data-act="view">視点リセット</button>
</div>

<a href="./orbis.html" style="position:fixed;right:38px;top:250px;font-size:12px;color:#c8ccd4;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:2px;">変形する銃 ORBIS-V / TALOS-IX →</a>
<div id="labels"></div>
<div id="loading"><div>LOADING MODEL</div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
