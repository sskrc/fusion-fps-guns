<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion FPS Guns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0d10; --card:#14181d; --line:rgba(255,255,255,.1); --text:#e8eaee; --dim:#8f96a1; --amber:#ffb020; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
  .wrap { max-width:1240px; margin:0 auto; padding:56px 28px 80px; }
  .mono { font-family:"Chakra Petch",monospace; letter-spacing:.1em; }
  header .tag { color:var(--amber); font-size:12px; }
  header h1 { font-family:"Chakra Petch"; font-weight:700; font-size:clamp(40px,7vw,84px); line-height:.95; letter-spacing:.02em; margin-top:6px; }
  header h1 span { color:transparent; -webkit-text-stroke:1px rgba(255,255,255,.4); }
  header p { color:var(--dim); font-size:14px; margin-top:16px; max-width:42em; }
  section { margin-top:56px; }
  section h2 { font-family:"Chakra Petch"; font-size:13px; font-weight:600; letter-spacing:.24em; color:var(--amber); display:flex; align-items:baseline; gap:14px;
               border-bottom:1px solid var(--line); padding-bottom:10px; }
  section h2 b { font-family:"Noto Sans JP"; font-size:19px; letter-spacing:.02em; color:var(--text); font-weight:700; }
  section h2 i { margin-left:auto; font-style:normal; color:var(--dim); font-size:12px; letter-spacing:.1em; }
  section > p { color:var(--dim); font-size:13px; margin:10px 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
  a.card { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none;
           transition:border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { border-color:var(--amber); transform:translateY(-3px); outline:none; }
  .card .pic { aspect-ratio:16/10; background:#6f7a88; overflow:hidden; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
  a.card:hover img { transform:scale(1.05); }
  .card .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .card .name { font-family:"Chakra Petch"; font-weight:700; font-size:19px; letter-spacing:.05em; }
  .card .role { font-size:12px; color:var(--amber); font-weight:500; }
  .card .desc { font-size:12.5px; color:var(--dim); line-height:1.65; margin-top:4px; }
  .card .go { margin-top:auto; padding-top:10px; font-family:"Chakra Petch"; font-size:11px; letter-spacing:.2em; color:var(--dim); }
  a.card:hover .go { color:var(--amber); }
  footer { margin-top:64px; padding-top:18px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; display:flex; gap:18px; flex-wrap:wrap; }
  footer a { color:var(--text); }
  @media (max-width:560px) { .wrap { padding:36px 16px 56px; } section h2 { flex-wrap:wrap; gap:4px 12px; } section h2 b { font-size:17px; } section h2 i { white-space:nowrap; } header .tag { font-size:10.5px; } .grid { grid-template-columns:1fr 1fr; gap:10px; } .card .desc { display:none; } .card .name { font-size:15px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag mono">3D MODEL COLLECTION &nbsp;//&nbsp; BUILT WITH AUTODESK FUSION</div>
    <h1>FUSION <span>FPS GUNS</span></h1>
    <p>Autodesk Fusion のスクリプトで作った、ゲーム向けの銃の3Dモデル集です。銃を選ぶと、3Dで回して眺めたり、アニメーションを再生したりできます。すべて表示用のモデルで、銃身は中実、内部機構はありません。</p>
  </header>
  <main id="list"></main>
  <footer><span>全 <b id="count"></b> 丁</span><a href="https://github.com/sskrc/fusion-fps-guns">GitHub でモデルとソースを見る</a></footer>
</div>
<script type="module">
import { SECTIONS, GUNS, hrefOf } from './guns.js';
const list = document.getElementById('list');
for (const s of SECTIONS) {
  const guns = GUNS.filter(g => g.sec === s.id);
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${s.title}<b>${s.ja}</b><i>${guns.length} 丁</i></h2><p>${s.note}</p><div class="grid"></div>`;
  const grid = sec.querySelector('.grid');
  for (const g of guns) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = hrefOf(g);
    a.innerHTML = `<div class="pic"><img src="${g.thumb}" alt="${g.name}" loading="lazy"></div>
      <div class="body"><div class="name">${g.name}</div><div class="role">${g.ja}</div><div class="desc">${g.desc}</div><div class="go">OPEN →</div></div>`;
    grid.appendChild(a);
  }
  list.appendChild(sec);
}
document.getElementById('count').textContent = GUNS.length;
</script>
</body>
</html>
