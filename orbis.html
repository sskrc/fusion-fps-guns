<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIS-V Morph Emitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05070b; --panel:rgba(10,16,24,.66); --line:rgba(140,220,255,.16); --text:#e6f1f8; --dim:#7f93a3; --acc:#46e1ff; --warn:#ff5a6e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:"Noto Sans JP",system-ui,sans-serif; overflow:hidden; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .mono { font-family:"Chakra Petch",monospace; letter-spacing:.1em; }
  .scan { position:fixed; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); mix-blend-mode:screen; }
  .vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 48%, transparent 45%, rgba(0,0,0,.6) 100%); }

  header { position:fixed; left:36px; top:30px; pointer-events:none; }
  header .tag { color:var(--acc); font-size:12px; transition:color .5s; }
  header h1 { font-family:"Chakra Petch"; font-weight:700; font-size:clamp(38px,6.4vw,86px); line-height:.92; letter-spacing:.03em; }
  header h1 span { color:transparent; -webkit-text-stroke:1px rgba(170,230,255,.45); }
  header p { color:var(--dim); font-size:13px; margin-top:10px; max-width:31em; line-height:1.7; }
  nav.pages { position:fixed; left:36px; bottom:30px; font-size:12px; }
  nav.pages a { color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
  nav.pages a:hover { color:var(--acc); }

  .status { position:fixed; right:36px; top:30px; width:270px; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px); padding:16px 18px; }
  .status h2 { font-family:"Chakra Petch"; font-size:11px; color:var(--dim); font-weight:500; letter-spacing:.22em; margin-bottom:8px; }
  .mode { font-family:"Chakra Petch"; font-weight:700; font-size:40px; line-height:1; color:var(--acc); letter-spacing:.06em; transition:color .5s; }
  .modeja { font-size:12px; color:var(--dim); margin:6px 0 14px; min-height:2.6em; line-height:1.5; }
  .bar { height:8px; background:rgba(255,255,255,.07); position:relative; overflow:hidden; }
  .bar i { position:absolute; inset:0 auto 0 0; width:100%; background:var(--acc); transition:background .5s; box-shadow:0 0 12px var(--acc); }
  .barlabel { display:flex; justify-content:space-between; font-size:11.5px; color:var(--dim); margin:10px 0 5px; }
  .barlabel b { font-family:"Chakra Petch"; color:var(--text); font-weight:600; }
  .row { display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-top:1px solid var(--line); margin-top:12px; }
  .row b { font-family:"Chakra Petch"; font-weight:600; color:var(--acc); letter-spacing:.06em; transition:color .5s; }

  .modes { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); display:flex; gap:10px; }
  .actions { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); display:flex; gap:8px; }
  button { font-family:"Noto Sans JP"; color:var(--text); background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(10px);
           padding:10px 16px 10px 11px; font-size:13.5px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:10px;
           transition:border-color .15s, background .15s, transform .08s, opacity .2s, box-shadow .2s; }
  button:hover { border-color:var(--acc); }
  button:active { transform:translateY(1px); }
  button kbd { font-family:"Chakra Petch"; font-size:11px; color:#031018; background:var(--acc); padding:2px 6px; min-width:22px; text-align:center; font-weight:700; transition:background .5s; }
  button small { font-family:"Chakra Petch"; font-size:10px; letter-spacing:.16em; color:var(--dim); }
  .modes button { flex-direction:column; align-items:flex-start; gap:4px; min-width:150px; padding:11px 14px; }
  .modes button .t { display:flex; align-items:center; gap:9px; font-family:"Chakra Petch"; font-weight:700; font-size:17px; letter-spacing:.08em; }
  .modes button.on { border-color:var(--acc); box-shadow:0 0 22px -6px var(--acc), inset 0 0 18px -10px var(--acc); }
  button.primary { border-color:rgba(70,225,255,.55); padding-right:26px; }
  button:disabled { opacity:.35; cursor:default; }
  #btnExplode.on { border-color:var(--acc); }
  .tools { position:fixed; right:36px; bottom:30px; display:flex; flex-direction:column; gap:8px; }
  .tools button { padding:8px 12px; font-size:12px; } .tools button.on { border-color:var(--acc); }
  .hint { position:fixed; left:50%; bottom:168px; transform:translateX(-50%); color:var(--dim); font-size:12.5px; pointer-events:none; text-align:center; min-height:1.4em; }
  .hint b { color:var(--text); font-weight:500; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); transition:opacity .6s; z-index:5; }
  #loading div { font-family:"Chakra Petch"; letter-spacing:.3em; color:var(--acc); font-size:13px; }
  #loading.done { opacity:0; pointer-events:none; }
  @media (max-width: 900px) {
    header { left:22px; top:20px; } header p { display:none; }
    .status { right:22px; top:auto; bottom:210px; width:200px; padding:12px; } .mode { font-size:28px; } .modeja { display:none; }
    .tools { display:none; }
    .modes { bottom:84px; gap:6px; } .modes button { min-width:0; padding:9px 10px; } .modes button small { display:none; } .modes button .t { font-size:13px; }
    .actions { bottom:22px; } button kbd { display:none; } .hint { bottom:150px; width:90%; }
    nav.pages { display:block; left:22px; top:92px; bottom:auto; }
    nav.pages a { background:var(--panel); border:1px solid var(--line); padding:7px 12px; display:inline-block; color:var(--text); }
  }
  @media (max-width: 560px) {
    header .tag { font-size:10px; } header { left:16px; top:16px; } nav.pages { left:16px; top:84px; }
    .status { top:80px; bottom:auto; right:16px; width:150px; padding:9px 11px; } .status h2 { display:none; } .mode { font-size:20px; margin-bottom:4px; }
    .barlabel { margin:6px 0 3px; font-size:10.5px; } .row { margin-top:8px; padding:5px 0 0; font-size:11px; }
    .hint { bottom:140px; font-size:11.5px; }
  }
  button { white-space:nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div class="vig"></div><div class="scan"></div>

<header>
  <div class="tag mono" id="tag">MORPH EMITTER &nbsp;//&nbsp; FICTIONAL DESIGN</div>
  <h1>ORBIS<span>-V</span></h1>
  <p>3つの形態に変形する架空のエネルギー銃です。形態を選ぶと外装が割れて組み替わり、展開した形態ではチャージして発射できます。ドラッグで回転、ホイールでズーム。</p>
</header>

<aside class="status">
  <h2>FORM</h2>
  <div class="mode" id="modeName">SEALED</div>
  <div class="modeja" id="modeJa"></div>
  <div class="barlabel"><span>エネルギー</span><b id="energyN">100%</b></div>
  <div class="bar"><i id="energyBar"></i></div>
  <div class="barlabel"><span>チャージ</span><b id="chargeN">0%</b></div>
  <div class="bar"><i id="chargeBar" style="width:0"></i></div>
  <div class="row"><span>状態</span><b id="sState">待機</b></div>
</aside>

<div class="hint" id="hint"></div>
<div class="modes" id="modes">
  <button data-mode="SEALED"><span class="t"><kbd>1</kbd>SEALED</span><small>封鎖形態</small></button>
  <button data-mode="LANCE"><span class="t"><kbd>2</kbd>LANCE</span><small>長射程・収束</small></button>
  <button data-mode="BLOOM"><span class="t"><kbd>3</kbd>BLOOM</span><small>広域・拡散</small></button>
</div>
<div class="actions">
  <button class="primary" id="btnFire" data-act="fire"><kbd>SPACE</kbd>チャージして発射</button>
  <button id="btnExplode" data-act="explode"><kbd>X</kbd><span id="explodeLabel">分解する</span></button>
</div>
<div class="tools">
  <button data-act="rotate" id="btnRotate">自動回転</button>
  <button data-act="sound" id="btnSound" class="on">サウンド ON</button>
  <button data-act="view">視点リセット</button>
</div>
<nav class="pages"><a href="./">← 銃の一覧へ</a></nav>
<div id="loading"><div>LOADING MODEL</div></div>
<script>
window.GUN = {
  assets: { rig: './assets/ORBIS_rig.json', parts: './assets/ORBIS_parts.glb' },
  view: { dist: 0.95, target: [0, -0.02, 0.1], floor: -0.2 },
  muzzle: { base: [190.6, 14, 0], slides: [['rail', 115]] },
  lockedHint: '封鎖形態では発射できません。<b>2</b> か <b>3</b> で展開してください。',
  forms: {
    SEALED: { ja: '外装を閉じた携行形態。発射機構はロックされます。', color: 0x46e1ff, glow: 2.2, cost: 0 },
    LANCE: { ja: '外装が前方へ割れ、レールが伸びる長射程形態。細く収束したビームを撃ちます。', color: 0x46e1ff, glow: 5.0, cost: 22,
             effect: 'beam', chargeMs: 700, recoil: { rail: -0.22, shell_yaw: 0.12, tail: 0.2 } },
    BLOOM: { ja: '外装と上下の顎が大きく開く広域形態。拡散する衝撃波を放ちます。', color: 0xff5ad2, glow: 6.0, cost: 38,
             effect: 'burst', chargeMs: 950, recoil: { beak: 0.14, jaw: 0.14, shell_yaw: 0.1, crest: 0.12 } },
  },
};
</script>
<script type="module" src="./morph.js"></script>
</body>
</html>
